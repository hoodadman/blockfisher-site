<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="hero-slogan-title">
  <title id="hero-slogan-title">Scanners spot a phish before you bite. Agents follow the trail and return the funds.</title>
  <rect width="360" height="480" fill="#0c1218"/>
  <line x1="24" y1="238" x2="336" y2="238" stroke="#3c7dff" stroke-width="2"/>

  <!-- Top: three scanners search the phish -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(28 72)">
      <circle cx="16" cy="16" r="14" stroke="#3c7dff" stroke-width="2"/>
      <path d="M16 8v16M12 14h6a3 3 0 0 1 0 6h-6" stroke="#e7eef6" stroke-width="2"/>
    </g>
    <path d="M60 88 L148 118" stroke="#3c7dff" stroke-width="2" stroke-dasharray="6 5" opacity="0.9"/>

    <g transform="translate(28 128)">
      <rect x="4" y="8" width="24" height="16" rx="3" stroke="#e7eef6" stroke-width="2"/>
      <path d="M4 14h24" stroke="#3c7dff" stroke-width="2"/>
      <circle cx="22" cy="20" r="2" fill="#3c7dff" stroke="none"/>
    </g>
    <path d="M60 144 L156 132" stroke="#3c7dff" stroke-width="2" stroke-dasharray="6 5" opacity="0.9"/>

    <g transform="translate(28 188)">
      <rect x="6" y="6" width="20" height="14" rx="2" stroke="#e7eef6" stroke-width="2"/>
      <path d="M12 24h8M16 20v4" stroke="#3c7dff" stroke-width="2"/>
    </g>
    <path d="M60 200 L160 148" stroke="#3c7dff" stroke-width="2" stroke-dasharray="6 5" opacity="0.9"/>
  </g>

  <!-- Phish hook -->
  <rect x="168" y="96" width="72" height="72" rx="8" fill="#151d28" stroke="#2c3b4d" stroke-width="1.5"/>
  <path d="M204 108v28c0 10-8 18-18 18" fill="none" stroke="#e7eef6" stroke-width="3" stroke-linecap="round"/>
  <path d="M186 154l-6 10" fill="none" stroke="#e7eef6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="204" cy="108" r="3" fill="#3c7dff"/>

  <!-- You: hand stops before the hook -->
  <path d="M268 118c-18 0-32 14-32 32 0 8 3 15 8 20" fill="#e7eef6" opacity="0.95"/>
  <path d="M244 170h36" stroke="#2c3b4d" stroke-width="3" stroke-linecap="round"/>
  <text x="244" y="108" fill="#b5c2d1" font-family="Outfit, Segoe UI, sans-serif" font-size="11" font-weight="600">Sign</text>

  <!-- Bottom: trail after the bite -->
  <g fill="#3c7dff">
    <rect x="44" y="268" width="22" height="22" rx="4" opacity="0.55"/>
    <rect x="78" y="292" width="22" height="22" rx="4" opacity="0.65"/>
    <rect x="112" y="316" width="22" height="22" rx="4" opacity="0.75"/>
    <rect x="146" y="340" width="22" height="22" rx="4" opacity="0.85"/>
    <rect x="180" y="364" width="22" height="22" rx="4" opacity="0.95"/>
    <rect x="214" y="388" width="22" height="22" rx="4"/>
  </g>
  <path d="M55 279 L89 303 L123 327 L157 351 L191 375 L225 399" fill="none" stroke="#3c7dff" stroke-width="1.5" opacity="0.5"/>

  <g transform="translate(44 255)" fill="none" stroke="#e7eef6" stroke-width="2" stroke-linecap="round">
    <path d="M8 12v14c0 6-4 10-10 10"/>
    <circle cx="8" cy="12" r="2" fill="#3c7dff" stroke="none"/>
  </g>

  <!-- Agent with funds -->
  <g transform="translate(248 360)">
    <ellipse cx="28" cy="52" rx="34" ry="8" fill="#151d28"/>
    <path d="M28 8c-8 0-14 6-14 14v22h28V22c0-8-6-14-14-14z" fill="#e7eef6"/>
    <path d="M18 44h20" stroke="#2c3b4d" stroke-width="2"/>
    <circle cx="38" cy="32" r="10" fill="none" stroke="#e7eef6" stroke-width="2"/>
    <circle cx="38" cy="32" r="4" fill="#e7eef6"/>
  </g>
  <path d="M300 388c14-2 28 4 36 16" fill="#e7eef6" opacity="0.9"/>
  <circle cx="336" cy="408" r="12" fill="none" stroke="#3c7dff" stroke-width="2"/>
</svg>
